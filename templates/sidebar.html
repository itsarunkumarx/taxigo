<div class="list-group sidebar-list">

    {% if request.user.role == "CUSTOMER" %}

        <a href="{% url 'customer_dashboard' %}" class="list-group-item list-group-item-action bg-dark text-white border-0 py-3 px-4">
            <i class="bi bi-speedometer2 me-2 text-warning"></i> Dashboard
        </a>

        <a href="{% url 'add_booking' %}" class="list-group-item list-group-item-action bg-dark text-white border-0 py-3 px-4">
            <i class="bi bi-taxi-front-fill me-2 text-warning"></i> Book Taxi
        </a>

        <a href="{% url 'booking_list' %}" class="list-group-item list-group-item-action bg-dark text-white border-0 py-3 px-4">
            <i class="bi bi-calendar-event me-2 text-warning"></i> My Bookings
        </a>

    {% elif request.user.role == "PARTNER" %}

        <a href="{% url 'partner_dashboard' %}" class="list-group-item list-group-item-action bg-dark text-white border-0 py-3 px-4">
            <i class="bi bi-speedometer2 me-2 text-warning"></i> Dashboard
        </a>

        <a href="{% url 'driver_list' %}" class="list-group-item list-group-item-action bg-dark text-white border-0 py-3 px-4">
            <i class="bi bi-people me-2 text-warning"></i> My Drivers
        </a>

        <a href="{% url 'vehicle_list' %}" class="list-group-item list-group-item-action bg-dark text-white border-0 py-3 px-4">
            <i class="bi bi-car-front-fill me-2 text-warning"></i> My Vehicles
        </a>

        <a href="{% url 'booking_list' %}" class="list-group-item list-group-item-action bg-dark text-white border-0 py-3 px-4">
            <i class="bi bi-calendar-event me-2 text-warning"></i> Bookings
        </a>

        <a href="{% url 'payment_list' %}" class="list-group-item list-group-item-action bg-dark text-white border-0 py-3 px-4">
            <i class="bi bi-credit-card-fill me-2 text-warning"></i> Payments
        </a>

        {% if request.user.driver_profile %}
            <a href="{% url 'driver_rides' %}" class="list-group-item list-group-item-action bg-dark text-white border-0 py-3 px-4">
                <i class="bi bi-steering-wheel me-2 text-warning"></i> My Rides
            </a>
        {% endif %}

    {% endif %}

</div>
