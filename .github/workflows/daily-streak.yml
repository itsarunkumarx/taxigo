name: Daily Commit Streak Maintainer

on:
  schedule:
    # Runs every day at 12:00 PM UTC (5:30 PM IST)
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Update Daily Streak File
        run: |
          echo "Last active streak update: $(date -u)" > STREAK.md
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add STREAK.md
          git diff-index --quiet HEAD || git commit -m "Auto maintain daily contribution streak [skip ci]"
          git push
