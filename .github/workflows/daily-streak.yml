name: Automated Quality Check & Daily 5x Commit Streak Maintainer

on:
  schedule:
    # Runs 5 times every day (every ~4.8 hours: 00:00, 05:00, 10:00, 15:00, 20:00 UTC)
    - cron: '0 0,5,10,15,20 * * *'
  workflow_dispatch:

jobs:
  quality-check-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies & Run Django System Check
        run: |
          python -m pip install --upgrade pip
          pip install Django gunicorn whitenoise dj-database-url psycopg2-binary PyMySQL Pillow django-mongodb-backend
          python manage.py check

      - name: Update Daily Streak File & Commit Verified Changes
        run: |
          echo "Automated quality check passed at: $(date -u)" > STREAK.md
          git config --global user.name "itsarunkumarx"
          git config --global user.email "arunkumarpalani428@gmail.com"
          git add STREAK.md static/images/
          git diff-index --quiet HEAD || git commit -m "Automated 5x daily contribution update & code quality check passed [skip ci]"
          git push
