name: Automated Daily Commit Streak Maintainer

on:
  schedule:
    # Runs every 20 minutes (3 times every hour = 72 times per day 24/7)
    - cron: '*/20 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality-check-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update Daily Streak File & Commit Verified Changes
        run: |
          echo "Automated daily contribution streak update: $(date -u)" > STREAK.md
          git config --global user.name "itsarunkumarx"
          git config --global user.email "arunkumarpalani428@gmail.com"
          git add STREAK.md
          git diff-index --quiet HEAD || git commit -m "Auto maintain daily contribution streak [skip ci]"
          git pull --rebase origin main || true
          git push origin main
